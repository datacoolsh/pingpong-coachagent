name: Build and Deploy

on:
  push:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          host: coachagent.datacool.fun
          username: gateway
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,JWT_SECRET
          script: |
            set -e
            DEPLOY_DIR=/opt/services/coachagent
            mkdir -p $DEPLOY_DIR

            # 登录 GHCR 拉取镜像
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            # 写入 .env 文件（包含敏感配置）
            cat > $DEPLOY_DIR/.env << EOF
            JWT_SECRET=${JWT_SECRET}
            DATABASE_URL=sqlite:///./data/coachagent.db
            DEBUG=false
            EOF
            chmod 600 $DEPLOY_DIR/.env

            # 写入 compose 文件
            cat > $DEPLOY_DIR/compose.yaml << 'COMPOSEFILE'
            services:
              backend:
                image: ghcr.io/datacoolsh/pingpong-coachagent/backend:latest
                volumes:
                  - backend-data:/app/data
                env_file:
                  - .env
                restart: unless-stopped

              frontend:
                image: ghcr.io/datacoolsh/pingpong-coachagent/frontend:latest
                ports:
                  - "8100:80"
                networks:
                  - default
                  - gateway-net
                depends_on:
                  - backend
                restart: unless-stopped

            volumes:
              backend-data:

            networks:
              gateway-net:
                external: true
            COMPOSEFILE

            cd $DEPLOY_DIR
            docker compose pull
            docker compose up -d
            docker image prune -f
